<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure OpenAI Realtime Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <h1 class="text-4xl font-extrabold text-center text-blue-700 my-6">Azure OpenAI Realtime Session</h1>
    <p class="max-w-xl mx-auto border border-red-300 bg-red-50 text-red-800 rounded p-4 my-6 text-center">
        WARNING: Don't use this code sample in production with the API key hardcoded. Use a protected backend service to
        call the sessions API and generate the ephemeral key. Then return the ephemeral key to the client.
    </p>

    <div class="max-w-xl mx-auto my-6 p-4 bg-white shadow rounded">
        <div class="mb-4">
            <label for="webrtcRegion" class="block text-sm font-medium mb-1">WebRTC Region</label>
            <select id="webrtcRegion" class="mt-1 block w-full border rounded p-2">
                <option value="eastus2" selected>eastus2</option>
                <option value="swedencentral">swedencentral</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="resourceName" class="block text-sm font-medium mb-1">Resource Name</label>
            <input type="text" id="resourceName" placeholder="YourAzureOpenAIResourceName" class="mt-1 block w-full border rounded p-2" />
        </div>
        <div class="mb-4">
            <label for="apiKey" class="block text-sm font-medium mb-1">API Key</label>
            <input type="password" id="apiKey" placeholder="YOUR_API_KEY_HERE" class="mt-1 block w-full border rounded p-2" />
        </div>
        <div class="mb-4">
            <label for="deployment" class="block text-sm font-medium mb-1">Deployment Name</label>
            <input type="text" id="deployment" value="gpt-4o-realtime-preview" class="mt-1 block w-full border rounded p-2" />
        </div>
    </div>

    <div class="flex justify-center mt-4 space-x-2">
        <button id="startSessionBtn" onclick="StartSession()" disabled class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">Start Session</button>
        <button id="closeSessionBtn" onclick="stopSession()" disabled class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">Close Session</button>
    </div>

    <!-- Log container for API messages -->
    <textarea id="logContainer" readonly class="w-full h-48 p-2 border rounded overflow-auto bg-gray-100"></textarea>

    <script src="./app.js"></script>

</body>

</html>
