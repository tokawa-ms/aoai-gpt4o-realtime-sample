<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure OpenAI Realtime Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <h1 class="text-4xl font-extrabold text-center text-blue-700 my-6">Azure OpenAI Realtime Session</h1>
    <p class="max-w-xl mx-auto border border-red-300 bg-red-50 text-red-800 rounded p-4 my-6 text-center">
        WARNING: Don't use this code sample in production with the API key hardcoded. Use a protected backend service to
        call the sessions API and generate the ephemeral key. Then return the ephemeral key to the client.
    </p>

    <div class="max-w-xl mx-auto my-6 p-4 bg-white shadow rounded">
        <div class="mb-4">
            <label for="webrtcRegion" class="block text-sm font-medium mb-1">WebRTC Region</label>
            <select id="webrtcRegion" class="mt-1 block w-full border rounded p-2">
                <option value="eastus2" selected>eastus2</option>
                <option value="swedencentral">swedencentral</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="resourceName" class="block text-sm font-medium mb-1">Resource Name</label>
            <input type="text" id="resourceName" placeholder="YourAzureOpenAIResourceName" class="mt-1 block w-full border rounded p-2" />
        </div>
        <div class="mb-4">
            <label for="apiKey" class="block text-sm font-medium mb-1">API Key</label>
            <input type="password" id="apiKey" placeholder="YOUR_API_KEY_HERE" class="mt-1 block w-full border rounded p-2" />
        </div>
        <div class="mb-4">
            <label for="deployment" class="block text-sm font-medium mb-1">Deployment Name</label>
            <input type="text" id="deployment" value="gpt-4o-realtime-preview" class="mt-1 block w-full border rounded p-2" />
        </div>
    </div>

    <div class="flex justify-center mt-4 space-x-2">
        <button id="startSessionBtn" onclick="StartSession()" disabled class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">Start Session</button>
        <button id="closeSessionBtn" onclick="stopSession()" disabled class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">Close Session</button>
    </div>

    <!-- Log container for API messages -->
    <textarea id="logContainer" readonly class="w-full h-48 p-2 border rounded overflow-auto bg-gray-100"></textarea>

    <script>
        // Removed hardcoded DEPLOYMENT, now configurable via UI
        const VOICE = "verse";

        // Add globals for peer connection
        let peerConnection;
        let dataChannel;

        // Functions to get values from UI
        function getDeployment() {
            return document.getElementById('deployment').value;
        }
        function getWebRtcUrl() {
            const region = document.getElementById('webrtcRegion').value;
            return `https://${region}.realtimeapi-preview.ai.azure.com/v1/realtimertc`;
        }
        function getSessionsUrl() {
            const resourceName = document.getElementById('resourceName').value;
            return `https://${resourceName}.openai.azure.com/openai/realtimeapi/sessions?api-version=2025-04-01-preview`;
        }
        function getApiKey() {
            return document.getElementById('apiKey').value;
        }

        function updateButtonStates() {
            const startBtn = document.getElementById('startSessionBtn');
            const closeBtn = document.getElementById('closeSessionBtn');
            const resource = document.getElementById('resourceName').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const sessionActive = !!peerConnection;
            if (sessionActive) {
                startBtn.disabled = true;
                closeBtn.disabled = false;
            } else {
                closeBtn.disabled = true;
                startBtn.disabled = !(resource && apiKey);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const resourceInput = document.getElementById('resourceName');
            const apiInput = document.getElementById('apiKey');
            const stored = localStorage.getItem('resourceName');
            if (stored) resourceInput.value = stored;
            resourceInput.addEventListener('input', (e) => {
                localStorage.setItem('resourceName', e.target.value);
                updateButtonStates();
            });
            apiInput.addEventListener('input', updateButtonStates);
            updateButtonStates();
        });

        async function StartSession() {
            // Disable Start Session button
            document.getElementById('startSessionBtn').disabled = true;

            // Validate required inputs
            const resourceName = document.getElementById('resourceName').value.trim();
            const apiKey = getApiKey();
            if (!resourceName || !apiKey) {
                alert('Resource Name and API Key are required');
                return;
            }
            try {
                const response = await fetch(getSessionsUrl(), {
                    method: "POST",
                    headers: {
                        "api-key": getApiKey(),
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: getDeployment(),
                        voice: VOICE
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API request failed: ${response.status} - ${errorText}`);
                }

                const data = await response.json();

                const sessionId = data.id;
                const ephemeralKey = data.client_secret?.value;
                console.error("Ephemeral key:", ephemeralKey);

                logMessage("Ephemeral Key Received: " + "***");
                logMessage("WebRTC Session Id = " + sessionId);

                init(ephemeralKey);

            } catch (error) {
                console.error("Error fetching ephemeral key:", error);
                logMessage("Error fetching ephemeral key: " + error.message);
            } finally {
                updateButtonStates();
            }
        }

        async function init(ephemeralKey) {

            // Use global variables instead of local
            peerConnection = new RTCPeerConnection();

            // Set up to play remote audio from the model.
            const audioElement = document.createElement('audio');
            audioElement.autoplay = true;
            document.body.appendChild(audioElement);

            peerConnection.ontrack = (event) => {
                audioElement.srcObject = event.streams[0];
            };

            // Set up data channel for sending and receiving events
            const clientMedia = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioTrack = clientMedia.getAudioTracks()[0];
            peerConnection.addTrack(audioTrack);

            dataChannel = peerConnection.createDataChannel('realtime-channel');

            dataChannel.addEventListener('open', () => {
                logMessage('Data channel is open');
                updateSession(dataChannel);
            });

            dataChannel.addEventListener('message', (event) => {
                const realtimeEvent = JSON.parse(event.data);
                console.log(realtimeEvent);
                logMessage("Received server event: " + JSON.stringify(realtimeEvent, null, 2));
                if (realtimeEvent.type === "session.update") {
                    const instructions = realtimeEvent.session.instructions;
                    logMessage("Instructions: " + instructions);
                } else if (realtimeEvent.type === "session.error") {
                    logMessage("Error: " + realtimeEvent.error.message);
                } else if (realtimeEvent.type === "session.end") {
                    logMessage("Session ended.");
                }
            });

            dataChannel.addEventListener('close', () => {
                logMessage('Data channel is closed');
            });

            // Start the session using the Session Description Protocol (SDP)
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            const sdpResponse = await fetch(`${getWebRtcUrl()}?model=${getDeployment()}`, {
                method: "POST",
                body: offer.sdp,
                headers: {
                    Authorization: `Bearer ${ephemeralKey}`,
                    "Content-Type": "application/sdp",
                },
            });

            const answer = { type: "answer", sdp: await sdpResponse.text() };
            await peerConnection.setRemoteDescription(answer);

            // Send a client event to update the session
            function updateSession(dataChannel) {
                const event = {
                    type: "session.update",
                    session: {
                        instructions: "You are a helpful AI assistant responding in natural, engaging language."
                    }
                };
                dataChannel.send(JSON.stringify(event));
                logMessage("Sent client event: " + JSON.stringify(event, null, 2));
            }
        }

        // Add global stopSession
        function stopSession() {
            if (dataChannel) dataChannel.close();
            if (peerConnection) peerConnection.close();
            peerConnection = null;
            logMessage("Session closed.");
            updateButtonStates();
        }

        function logMessage(message) {
            const logContainer = document.getElementById("logContainer");
            logContainer.value += message + "\n";
            logContainer.scrollTop = logContainer.scrollHeight;
        }
    </script>
</body>

</html>
